name: Instalador Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-opencv

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Juntar ejecutable y DLLs
        run: |
          mkdir -p dist
          cp build/ContadorColonias.exe dist/
          WDQ=$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt)
          "$WDQ" --release --no-translations --compiler-runtime dist/ContadorColonias.exe
          for i in 1 2 3; do
            find dist -iname '*.exe' -o -iname '*.dll' | while read -r f; do
              ldd "$f" | awk '/\/mingw64\// {print $3}' | while read -r d; do
                [ -f "dist/$(basename "$d")" ] || cp "$d" dist/
              done
            done
          done
          ls -la dist

      - name: Armar instalador
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ContadorColonias VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=$version" instalador\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: salida/*.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Versión ${{ github.ref_name }} - Instalador
          files: salida/*.exe
